[project]
name = "job-search-assistant"
version = "0.1.0"
description = "Personal job-search agent: ingest, extract, RAG, knowledge graph, MCP, agent."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lingua-language-detector>=2.1.1",
    "mcp>=2.3.0",
    "neo4j>=6.4.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
