description: |
  Über deinen neuen Arbeitsplatz:
  Die Praxis liegt zentral zwischen den Bahnhöfen Frankfurt (Main) Lokalbahnhof und Frankfurt (Main) Süd und ist damit hervorragend erreichbar. Das lebendige Umfeld aus urbanem Flair, Apfelweintradition und kreativer Szene schafft einen besonderen Praktikumsplatz.

  Geleitet wird die Praxis von unserer erfahrenen Logopädin Harisha Haritas. Und falls während deines Praktikums mal Fragen aufkommen: Unser gesamtes Team aus Logopäd:innen und Ergotherapeut:innen steht dir jederzeit mit Rat und Tat zur Seite!

  Warum wir?

  - Teile uns deine priorisierten Behandlungsfelder gerne mit, teils können wir dies berücksichtigen und dir die richtige Logopäd:in zuteilen 
  - Unsere erfahrenen Therapeut:innen geben euch gerne Einblicke in die moderne Therapiegestaltung und anfallenden Tätigkeiten im Praxisalltag
  - Wir unterstützen dich dabei unter Supervision auch selbst erste Therapieversuche zu starten
  - Wir bieten in all unseren Praxen Praktika an und stehen mit Herz dahinter, unseren Praktikant:innen erste Einblicke in den Praxisalltag zu geben
  - Bei Palabra haben wir bereits reichlich Erfahrung in unserem Praktiprogramm gesammelt- wir organisieren Events wie die PraktiCON. Hier sind auch ehemalige Praktikant:innen gerne zu Besuch.
  - Bei Interesse schau gerne bei unserem Instagram vorbei: palabra_therapie

  Was dich bei uns erwartet:

  - Hospitation in der Logopädie
  - Unterstützung der Logopäd:innen im Praxisalltag
  - Du teilst dein bisherig erworbenes Wissen zu Störungsbildern
  - Du stellst proaktiv Fragen bei Unsicherheiten
  - Diskreter Umgang mit den persönlichen Informationen der Patient:innen

  Dein Profil

  - Du bist Logopäd:in in Ausbildung
  - Du hast Lust dein erworbenes theoretischen Wissen in die Praxis umzusetzen
  - Du bist motiviert mehr über logopädische Behandlungsfelder zu erfahren und zusammen mit deiner Praktikumsanleitung Lösungen zu erarbeiten

  Find more English Speaking Jobs in Germany on Arbeitnow
