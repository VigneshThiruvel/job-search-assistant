job:
  source: bundesagentur
  source_job_id: 11949-17383626-S
  stratum: target_en_mentions_german
  title: Data Scientist
  company: MED-EL Elektromedizinische Geräte GmbH
  location: Hötting
  url: https://www.arbeitsagentur.de/jobsuche/jobdetail/11949-17383626-S
  lang: en

description: |
  As Information Technology Department we enable digital processes and reliable IT services across the company. Our Data & Analytics Team collaborates with the business to develop, support, maintain, and govern data warehouse, data platform, and BI solutions that enable informed decision-making.



  Your Tasks

  Design, build, maintain, and optimize scalable data pipelines that integrate data from APIs, databases, and other sources

  Develop and enhance ETL/ELT processes and data models to support analytics, reporting, and business intelligence

  Collaborate with business stakeholders to gather requirements and deliver reliable, high-quality data solutions

  Ensure the scalability, performance, and reliability of the data platform while continuously improving the data architecture

  Support users of the data warehouse and data platform, contribute to data quality initiatives, and participate in code reviews and CI/CD processes



  Your Profile

  Completed Bachelor's degree or higher (University, FH) in Data Science, Computer Science, or a related field, along with at least 3 years of professional experience

  Strong SQL skills and solid Python experience for data engineering and automation

  Hands-on experience with Microsoft Fabric, Azure, Snowflake, SAP BDC or similar cloud data platforms, including ETL/ELT development, is desirable

  Experience with Power BI, Git, CI/CD, and working in Agile (Scrum/Kanban) development environments

  Strong analytical and problem-solving skills with excellent English communication skills; German is an advantage

  Please apply in English!

  Further information about MED-EL can be found https://www.medel.com/about-medel.



  Full-time post 38,5 hours per week, flexible working time model with core working hours, details will be discussed in a personal interview.



  Want to join a company that helps bring the joy of sound to people with hearing loss? Apply now!

  https://jobs.medel.com/EN/open-position/IT_12610/online 

  A personal interview is only possible after prior invitation from the HR department.
