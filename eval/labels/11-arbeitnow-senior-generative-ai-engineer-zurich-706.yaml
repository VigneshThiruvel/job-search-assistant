  lang: en

description: |
  Occupancy: 100% / Start date: 01.06.2026/ Initial duration: 12 months

  We are looking for an experienced Senior Data Scientist to help design and deliver enterprise-grade Generative AI solutions with a strong focus on Retrieval-Augmented Generation (RAG). You will work in a collaborative DevOps environment, building scalable AI applications and driving innovation across modern cloud platforms.

  Responsibilities & Tasks

  -
  Develop and deploy production-ready GenAI and RAG solutions using modern AI engineering practices.

  -
  Build scalable APIs, data pipelines, and integrations for AI-powered enterprise applications.

  -
  Collaborate with Data Engineers, Cloud Engineers, DevOps teams, and business stakeholders to deliver operational AI solutions.

  -
  Monitor, optimize, and fine-tune machine learning and GenAI applications in production environments.

  -
  Support CI/CD processes, automated deployments, observability, and AI platform reliability.

  Requirements & Qualifications

  -
  5–8 years of experience in Data Science, AI Engineering, or related roles.

  -
  Strong expertise in Generative AI, RAG architectures, prompt engineering, and context management.

  -
  Experience with tools and frameworks such as LangChain, LangFuse, NeMo Guardrails, Spring AI, and Azure AI services.

  -
  Solid skills in Python and Java, plus experience with APIs, CI/CD, OpenTelemetry, and cloud-native deployments on Azure.

  -
  Fluent German (C2 level) and strong English communication skills (B2 or higher).

  Benefits & Culture

  -
  Work on innovative AI and cloud projects using modern technologies and scalable architectures.

  -
  Join a collaborative, cross-functional engineering environment focused on continuous learning and technical excellence.

  -
  Long-term project opportunity with strong potential for professional growth and impactful work.

