  seniority: working_student              # intern | working_student | junior | mid | senior | lead | unknown
  employment_type: part_time        # full_time | part_time | contract | freelance | unknown
  german_level: basic           # none | plus | basic | business | fluent | native
  german_implied: false         # true/false: level inferred (e.g. German-only posting), not stated
  english_level: fluent          # none | plus | basic | business | fluent | native
  other_languages: []      # non-German/English, e.g. ["Dutch: fluent"] (same scale)
