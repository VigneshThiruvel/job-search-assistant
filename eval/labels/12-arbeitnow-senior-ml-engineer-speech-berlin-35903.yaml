reviewed: true             # true only after a human checked every field below
labelled_by: claude-draft   # human | claude-draft (who wrote the labels before review)
labels:
  is_target_role: true      # true/false: one of the roles in CLAUDE.md "Search scope"
  role_family: "ml_engineer"  # data_analyst | data_engineer | data_scientist | ai_engineer | ml_engineer | analytics_engineer | bi_analyst | other
  seniority: "senior"       # intern | working_student | junior | mid | senior | lead | unknown
  employment_type: "unknown"  # full_time | part_time | contract | freelance | unknown
  german_level: "none"      # none | plus | basic | business | fluent | native
  german_implied: false     # true/false: level inferred (e.g. German-only posting), not stated
  english_level: "none"     # none | plus | basic | business | fluent | native
  other_languages: []       # non-German/English, e.g. ["Dutch: fluent"] (same scale)
  workplace: "hybrid"       # onsite | hybrid | remote | unknown
  years_experience_min:     # integer, or leave empty if not stated
  degree: "unknown"         # none | vocational | bachelor | master | phd | unknown (minimum required)
  required_skills: ["Deep Learning", "Speech Recognition", "ASR", "Speech-to-Text", "Python", "PyTorch", "MLOps", "Testing"]  # as written, e.g. [SQL, Python, Power BI]
  nice_to_have_skills: [] 
  restrictions: []          # eligibility as written, e.g. ["enrolled student", "EU citizens only"]
  salary:                   # as written, or leave empty
  notes: "'Several years' is not a number -> years empty. 'Berlin office or remotely across Germany' + 'good hybrid set-up' -> hybrid (remote within Germany also possible). No language statement in an English posting -> none."  # anything ambiguous; why you chose a label

