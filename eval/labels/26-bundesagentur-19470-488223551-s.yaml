job:
  source: bundesagentur
  source_job_id: 19470-488223551-S
  stratum: target_de
  title: AI Engineer - Smart Factories (w/m/d)
  company: SEW-EURODRIVE GmbH & Co KG
  location: Graben-Neudorf
  url: https://www.arbeitsagentur.de/jobsuche/jobdetail/19470-488223551-S
  lang: de

description: |
  In unserem Bereich Production Management Digital Operations gestalten Sie aktiv die digitale Transformation unserer hochmodernen Werke am Standort Deutschland weiter. Werden Sie ein Teil unseres Familienunternehmens. Wir denken langfristig, agieren nachhaltig und wachsen kontinuierlich. Bewegen Sie zusammen mit uns die Welt.

   

  Ihre Aufgaben

       * Digitale Weiterentwicklung der Produktionsstandorte in Deutschland hin zu AI gestützten Smart Factories 
       * Etablierung effizienter AI-Umsetzungs- und Betriebsmodelle, von der strukturierten Lösungsentwicklung über den stabilen Betrieb bis zur kontinuierlichen Weiterentwicklung im Tagesgeschäft
       * Anwendung erklärbarer Analyse- und Modellansätze (Explainable AI), um AI-gestützte Entscheidungen transparent, nachvollziehbar und für Menschen nutzbar zu machen
       * Kontinuierliche Beobachtung neuer Technologien, Methoden und Trends, deren kritische Einordnung sowie gezielte Überführung geeigneter Ansätze in praxistaugliche, industrielle Lösungen für unsere Produktionsstandorte
       * Enge Zusammenarbeit mit nationalen und internationalen Teams, Förderung des Wissenstransfers sowie Unterstützung bei der standortübergreifenden Harmonisierung und nachhaltigen Skalierung erfolgreicher Lösungen

   Ihre Qualifikation  

       * Abgeschlossenes Studium der Data Science, Ingenieurwissenschaften, Informatik, Wirtschaftsinformatik oder vergleichbare Qualifikation
       * Ausgeprägtes Verständnis für industrielle Produktions- und Betriebsprozesse sowie die Fähigkeit, diese in daten- und AI-gestützte Lösungen zur Entscheidungsfindung und Optimierung zu überführen
       * Fundierte praktische Erfahrung im Bereich Data Engineering und Machine Learning, verbunden mit der Fähigkeit, Daten- und AI-Lösungen von der Entwicklung in den stabilen operativen Betrieb zu überführen und kontinuierlich weiterzuentwickeln
       * Idealerweise Erfahrung mit ereignisgetriebenen und agentenbasierten AI-Ansätzen sowie die Fähigkeit, deren Nutzen, Grenzen und Reifegrad im industriellen Kontext realistisch zu bewerten
       * Ausgeprägte Kommunikations- und Übersetzungsfähigkeit, um komplexe Daten-, AI- und Technologiethemen verständlich, wirkungsvoll und adressatengerecht über Fachbereiche, Standorte und kulturelle Grenzen hinweg zu vermitteln
       * Sehr gute Deutschkenntnisse (C1-Niveau) und gute Englischkenntnisse in Wort und Schrift
          

  Darum sind Sie bei uns richtig

       * Wir bieten ein attraktives Gehaltspaket.
         Bundesweit nach Tarif Metall- und Elektroindustrie Baden-Württemberg, tarifliche Sonderzahlungen sowie langjährige attraktive betriebliche Altersvorsorge
       * Ihre Work-Life-Balance liegt uns am Herzen.
         Individuelle flexible Arbeitszeitmodelle, mobile Arbeit, Gleitzeitkonto, Mitarbeiterrabatte und Sonderkonditionen, Kooperation mit Fitnessstudios, Freizeitangebote und Kindertagesstätte 
       * Entwickeln Sie sich bei uns weiter.
         Unser hauseigenes Schulungszentrum DriveAcademy® und unsere E-Learning Plattform ergänzen sich gegenseitig durch ein vielfältiges Angebot an Seminaren und Schulungen
       * Fühlen Sie sich bei uns wohl.
         Hochmoderne Technik, IT-Ausstattung und Software-Tools, Betriebsrestaurant und SEW Parkhaus mit Elektroladestationen
       * Wir legen Wert auf eine hohe Arbeitsplatzsicherheit.
         Durch kontinuierliche Investitionen in den Standort Deutschland, sind wir für die Zukunft bestens gerüstet, um als Global Player voran zu gehen

  Haben wir Ihr Interesse geweckt?

  Dann freuen wir uns auf Ihre Bewerbung!         
  Bei Fragen steht Ihnen Patrick Frank unter 07251 75 - 1925 gerne zur Verfügung.         
  Auf unserer FAQ-Seite finden Sie einen Überblick über unseren Bewerbungsprozess und weitere Benefits.
