description: |
  ### Ihre Vorteile:

  - Mitarbeit an innovativen KI- und Automatisierungsvorhaben mit unterschiedlichen Use Cases
  - Abwechslungsreiche Einsätze an der Schnittstelle zwischen Fachbereich, IT und Technologie
  - Möglichkeit, Lösungsansätze von der Anforderungsanalyse bis zur Umsetzung aktiv mitzugestalten

  ### Ihre Aufgaben:

  - Analyse und Strukturierung fachlicher Anforderungen und Geschäftsprozesse im Kontext von KI- und Automatisierungsprojekten
  - Identifikation, Bewertung und Priorisierung geeigneter KI- und Automatisierungs-Use-Cases
  - Planung und Moderation von Workshops mit Fachbereichen, IT und weiteren Stakeholdern
  - Überführung fachlicher Anforderungen in tragfähige Lösungs- und Umsetzungskonzepte
  - Entwicklung von Zielbildern sowie Integrations-, Daten- und Lösungskonzepten unter Berücksichtigung bestehender Systeme
  - Bewertung von Lösungsoptionen hinsichtlich Nutzen, Machbarkeit, Risiken, Datenschutz und Informationssicherheit sowie Begleitung der Umsetzung

  ### Ihre Qualifikationen:

  - Fundierte Erfahrung in der Business Analyse und/oder im Solution Design
  - Projekterfahrung im Umfeld von KI, Automatisierung oder Prozessdigitalisierung
  - Erfahrung in der Aufnahme, Analyse und Dokumentation fachlicher Anforderungen und Prozesse
  - Kenntnisse in der Konzeption von Lösungsarchitekturen, Integrationen und Datenkonzepten
  - Erfahrung in der Moderation von Workshops und im Stakeholdermanagement zwischen Fachbereich und IT
  - Idealerweise Projekterfahrung im Versicherungs- oder Finanzdienstleistungsumfeld

  ### Über Hays:

  Der Bereich IT ist unsere Kernkompetenz, auf deren Grundlage sich Hays entwickelt hat. Wir sind das größte privatwirtschaftlich organisierte IT-Personaldienstleistungsunternehmen in Deutschland und haben für jede Karrierestufe das passende Angebot - egal ob Sie an Vakanzen in agilen KMUs oder starken DAX-Konzernen interessiert sind. Wir beherrschen die komplette IT-Klaviatur von Support bis zur Softwarearchitektur oder Digitalisierung - dank unseres umfangreichen Portfolios ist für jeden etwas dabei. So konnten wir in den vergangenen Jahrzehnten im Rahmen einer Life-Long-Partnerschaft unzählige Fach- und Führungskräfte aus der IT dabei unterstützen, die Weichen für eine erfolgreiche Karriere zu stellen. Unser Beratungsteam ist spezialisiert und somit in der Lage, auf Ihre Wünsche und Vorstellungen einzugehen und Sie auf Bewerbungsgespräche und Vertragsverhandlungen bestens vorzubereiten. Probieren Sie es aus und erfahren Sie, was der Markt Ihnen zu bieten hat - völlig kostenfrei, diskret und unverbindlich! Wir freuen uns auf Sie.
