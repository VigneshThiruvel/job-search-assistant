description: |
  SAP MDG / Master Data Quality Analyst (m/w/d)

  Stunden pro Woche

  •

  unbefristet

  •

  Frühester Beginn ab sofort

  Sorge für verlässliche Stammdaten und gestalte Data Quality in einem internationalen Industrieumfeld.

  ## Datenqualität mit messbarer Wirkung.

  Du möchtest die Qualität geschäftskritischer Stammdaten nicht nur prüfen, sondern nachhaltig verbessern? Bei Liebherr entwickelst du Data-Quality-Monitoring, machst Datenrisiken transparent und arbeitest mit Fachbereichen, Data Ownern und IT an belastbaren Lösungen.

  Für diese Position ist ein marktübliches Jahresbruttogehalt von 70.000–88.000 € vorgesehen – abhängig von Erfahrung und Qualifikation.

  ## Deine Aufgaben

  - Du entwickelst und pflegst das MDM-Data-Quality-Monitoring mit Regelwerken, Kennzahlen und Performance-Metriken.
  - Du erstellst Reporting- und Analytics-Lösungen, Power-BI-Dashboards sowie Management-Reports.
  - Du analysierst Datenqualitäts-KPIs, Validierungsergebnisse und Trends und leitest konkrete Maßnahmen ab.
  - Du verfolgst Data Readiness, Data Cleansing und Datenvalidierungen über verschiedene Datenbereiche hinweg.
  - Du identifizierst Datenqualitätsrisiken und Engpässe und koordinierst Verbesserungsmaßnahmen.
  - Du unterstützt globale Datenmigrationen sowie Root-Cause-Analysen in Stammdatenprozessen.

  ## Das bringst du mit

  - Abgeschlossenes Studium in Wirtschaftsinformatik, Informatik, Data Management oder eine vergleichbare Qualifikation.
  - Mehrjährige Erfahrung in Master Data Management und Data Quality Management.
  - Fundierte Kenntnisse in SAP MDG, SAP S/4HANA, Datenmigration und Stammdatenprozessen.
  - Sehr gute Kenntnisse in Reporting und Analytics, insbesondere Power BI, Advanced Excel, SQL und Datenmodellierung.
  - Analytische, strukturierte und lösungsorientierte Arbeitsweise.
  - Sehr gute Deutsch- und Englischkenntnisse sowie Bereitschaft zu gelegentlichen Dienstreisen.

  ## Fachlich tief, aber nicht isoliert.

  Die Rolle verbindet Analyse, Monitoring und operative Verbesserung. Du arbeitest nicht nur mit Daten und Tools, sondern stimmst dich eng mit globalen Fachbereichen, Data Ownern und der IT ab.

  ## International zusammenarbeiten

  Liebherr verbindet langfristige Perspektiven eines Familienunternehmens mit globalen Teams und modernen digitalen Themen. Eigenverantwortung, klare Zusammenarbeit und kontinuierliche Verbesserung prägen das Umfeld.

  ## Darauf kannst du dich freuen

  - Unbefristete Vollzeitposition mit hybriden Arbeitszeitmodellen, Gleitzeit und 30 Tagen Urlaub.
  - Weiterbildungsangebote und internationale Zusammenarbeit.
  - Jobticket oder Fahrtkostenzuschuss, Betriebsrestaurant und Bike-Leasing.
  - Betriebliche Altersvorsorge sowie Angebote für Sport und Freizeit.
  - Jahresbruttogehalt von 70.000–88.000 €, abhängig von Erfahrung und Qualifikation.

  ## So geht es weiter

  1. Du bewirbst dich mit deinem Lebenslauf und relevanten Zeugnissen.
  2. Wir prüfen deine Unterlagen und sprechen vertraulich über die Position.
  3. Bei beiderseitigem Interesse begleiten wir dich durch die weiteren Gespräche.

  ## Vertraulich und transparent

  Deine Bewerbung wird vertraulich behandelt. Für den ersten Schritt genügt dein Lebenslauf mit relevanten Nachweisen; ein Anschreiben ist nicht erforderlich.

  ## Dein Einstieg

  Du lernst die MDM-Landschaft, relevante Datenprozesse und wichtige Schnittstellen kennen. Anschließend übernimmst du schrittweise Verantwortung für Monitoring, Analysen und Verbesserungsinitiativen.

  Du möchtest Data Quality im internationalen Umfeld sichtbar voranbringen? Dann bewirb dich jetzt.
