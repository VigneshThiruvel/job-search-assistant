reviewed: true             # true only after a human checked every field below
labelled_by: claude-draft   # human | claude-draft (who wrote the labels before review)
labels:
  is_target_role: true      # true/false: one of the roles in CLAUDE.md "Search scope"
  role_family: "ai_engineer"  # data_analyst | data_engineer | data_scientist | ai_engineer | ml_engineer | analytics_engineer | bi_analyst | other
  seniority: "mid"          # intern | working_student | junior | mid | senior | lead | unknown
  employment_type: "full_time"  # full_time | part_time | contract | freelance | unknown
  german_level: "fluent"    # none | plus | basic | business | fluent | native
  german_implied: true      # true/false: level inferred (e.g. German-only posting), not stated
  english_level: "none"     # none | plus | basic | business | fluent | native
  other_languages: []       # non-German/English, e.g. ["Dutch: fluent"] (same scale)
  workplace: "hybrid"       # onsite | hybrid | remote | unknown
  years_experience_min:     # integer, or leave empty if not stated
  degree: "vocational"      # none | vocational | bachelor | master | phd | unknown (minimum required)
  required_skills: ["Machine Learning", "Forecasting", "Time Series Analysis", "MLOps", "Generative AI", "LLMs", "RAG", "AI Agents", "Python", "Git", "CI/CD", "Vector Databases", "Semantic Search", "MCP", "Cloud"]  # as written, e.g. [SQL, Python, Power BI]
  nice_to_have_skills: ["Databricks", "Azure", "AWS", "Google Cloud"]
  restrictions: []          # eligibility as written, e.g. ["enrolled student", "EU citizens only"]
  salary: "bis zu 80.400 € Bruttojahresgehalt (Vollzeit, Tarif)"  # as written, or leave empty
  notes: "Mix of classic ML (forecasting) and GenAI platform; LLM/RAG/agents explicitly 'vorausgesetzt' -> ai_engineer (ml_engineer defensible). 'Voll- oder Teilzeit' -> full_time (both offered). 'Studium oder vergleichbare Ausbildung' -> minimum is vocational. German-only posting -> fluent, implied. 'Fundierte Erfahrung' -> mid."  # anything ambiguous; why you chose a label

job:
  source: bundesagentur
  source_job_id: 12288-4961410192-S
  stratum: target_de
  title: KI-Plattform-Experte (m/w/d) mit Schwerpunkt Data Science und LLM Engineering
  company: Sparda-Bank Hannover eG
  location: Hannover
  url: https://www.arbeitsagentur.de/jobsuche/jobdetail/12288-4961410192-S
  lang: de

description: |
  Stellenbeschreibung: Die Sparda-Bank Hannover ist eine
  genossenschaftliche Bank. Wir kümmern uns seit 1903 um unsere
  Mitmenschen. Dabei sind wir entsprechend unserem Leitbild in allen
  Fragen rund um das Thema "Finanzen" der faire und sympathische
  Ansprechpartner, der mit einfachen und leistungsstarken Angeboten
  überzeugt. Maßgebend für den Erfolg unseres Hauses sind unsere
  Mitarbeiter (m/w/d). Deshalb ist uns deren Zufriedenheit und gute
  Ausbildung ein besonderes Anliegen. Wir unterstützen sie dabei,
  persönliche und fachliche Kompetenzen auszubauen. Am Standort
  Hannover suchen wir zum nächstmöglichen Termin in Voll- oder
  Teilzeit einen KI-Plattform-Experten (m/w/d) mit Schwerpunkt Data
  Science und LLM Engineering für unseren Bereich Künstliche
  Intelligenz Damit unterstützen Sie uns – so gestalten Sie mit uns
  die Zukunft Aufbau, Betrieb und kontinuierliche Weiterentwicklung
  einer skalierbaren und modularen Infrastruktur (KI-Plattform) zur
  Entwicklung und produktivem Betrieb von KI-Lösungen Sie konzipieren
  und entwickeln eigenständige KI-Anwendungen, von klassischen
  Machine-Learning-Modellen bis hin zu modernen KI-Agenten; dabei
  schaffen Sie insbesondere Lösungen, wenn am Markt keine geeigneten
  Standardprodukte verfügbar sind oder bestehende Lösungen gezielt
  erweitert werden sollen Sie gestalten und etablieren Prozesse,
  Standards und Governance-Richtlinien für die bankinterne
  Eigenentwicklung von KI-Lösungen und fördern deren nachhaltige
  Verankerung, beispielsweise durch professionelle Code-Versionierung
  und moderne Entwicklungsstandards Stets enger Austausch und
  Zusammenarbeit mit Fachbereichen und KI-Fachkräften bei der
  Pilotierung und Einführung neuer KI-Use-Cases auf der KI-Plattform
  Das wünschen wir uns von Ihnen Abgeschlossenes Studium oder eine
  vergleichbare Ausbildung im Bereich der (Wirtschafts-)Informatik, Data
  Science, Mathematik oder einer vergleichbaren Fachrichtung Fundierte
  Erfahrung in der Entwicklung und Operationalisierung von
  Machine-Learning-Modellen, insbesondere für Prognose- und
  Zeitreihenanalysen, sowie in der Umsetzung generativer KI-Anwendungen;
  Kenntnisse im Umfeld von Large Language Models (LLMs),
  Retrieval-Augmented Generation (RAG) und KI-Agenten setzen wir voraus
  Gute Programmierkenntnisse in Python sowie praktische Erfahrungen mit
  Code-Versionierung, Git-basierten Entwicklungsprozessen und
  CI/CD-Pipelines Praktische Erfahrung im Aufbau und Betrieb einer
  modularen und skalierbaren KI-Entwicklungsplattform – idealerweise
  Databricks oder eine vergleichbare Lösung Kenntnisse im Aufbau und
  Betrieb von Datenarchitekturen für Generative-AI-Anwendungsfälle,
  insbesondere im Kontext von Retrieval-Augmented Generation (RAG),
  Vektordatenbanken, semantischen Suchverfahren und dem Model Context
  Protocol (MCP) zur Anbindung von Datenquellen, Anwendungen und
  KI-Agenten Vertrautheit mit Cloud-Technologien, insbesondere im
  Kontext KI – idealerweise mit Microsoft Azure oder einem
  vergleichbaren Hyperscaler wie AWS oder Google Cloud Darauf können
  Sie sich freuen Anspruchsvolle und abwechslungsreiche Tätigkeit in
  einem engagierten Team Moderne Arbeitsumgebung mit kurzen
  Entscheidungswegen Eine langfristige Perspektive in einem
  leistungsstarken und zukunftsorientierten Unternehmen Sie arbeiten bei
  einem Arbeitgeber, der in 2023, 2024 und 2025 mit dem KUNUNU Award als
  TOP ARBEITGEBER ausgezeichnet wurde Die Vergütung erfolgt auf
  Grundlage unseres Tarifvertrages Mit unserem Paket aus Vergütung,
  festen Sonderzahlungen und der betrieblichen Altersvorsorge zahlen wir
  in Summe mehr als 14 Monatsgehälter, das entspricht bei Vollzeit
  einen Bruttojahresgehalt bis zu 80.400,00 Euro Großzügiger
  Fahrgeldzuschuss und vermögenswirksame Leistungen Gezielte
  Fortbildungsmaßnahmen Flexible Arbeitszeiten mit
  Homeoffice-Möglichkeiten und individuelle Teilzeitmodelle 30 Tage
  Urlaub im Jahr plus zusätzliche Urlaubstage bei persönlichen
  Anlässen, Heiligabend und Silvester sind frei Regelmäßige
  Mitarbeiterveranstaltungen und gemeinsame Feiern Regelmäßige
  After-Work-Angebote (z. B. Rückenfitness, Kreativkurse,
  Ernährungsberatung und Persönlichkeitstraining) Bike-Leasing
  Corporate Benefits Haben Sie Lust auf eine neue Herausforderung? Wir
  sind gespannt auf Ihre aussagefähige Onlinebewerbung und freuen uns
  darauf, Sie kennenzulernen! Für Ihre Fragen und weitere Informationen
  steht Ihnen Moritz Witte , Bereichsleiter Künstliche Intelligenz,
  gerne zur Verfügung: Telefon 0511 3018-4610, E-Mail
  moritz.witte@sparda-h.de. www.sparda-h.de/karriere/wir-als-arbeitgeber
  Sparda-Bank Hannover eG Personalservice · Ernst-August-Platz 8 ·
